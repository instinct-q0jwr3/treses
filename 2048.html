<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>2048</title>
<style>
  :root{
    --bg:#faf8ef; --board:#bbada0; --cell:#cdc1b4;
    --ink:#776e65; --accent:#edcf72;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overscroll-behavior:none;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex; justify-content:center; min-height:100dvh;
  }
  .wrap{width:min(92vw,430px); padding:max(12px, env(safe-area-inset-top)) 0 20px;}
  h1{font-size:2rem; margin:10px 0 8px; letter-spacing:.5px;}
  .topbar{display:flex; gap:8px; align-items:stretch; margin-bottom:12px;}
  .box{
    flex:1; background:#bbada0; border-radius:10px; padding:6px 10px;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
  }
  .box .label{font-size:.62rem; text-transform:uppercase; letter-spacing:.8px; color:#eee4da; font-weight:700;}
  .box .val{font-size:1.25rem; font-weight:800; line-height:1.2; color:#fff;}
  .board{
    display:grid; grid-template-columns:repeat(4,1fr); gap:10px;
    background:var(--board); border-radius:14px; padding:10px;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  .cell{
    aspect-ratio:1; border-radius:8px; background:var(--cell);
    display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:clamp(1.6rem,9vw,2.6rem); color:#776e65;
  }
  .cell.empty{background:rgba(238,228,218,.4);}
  .cell.v4{background:#ede0c8;}
  .cell.v8{background:#f2b179; color:#f9f6f2;}
  .cell.v16{background:#f59563; color:#f9f6f2;}
  .cell.v32{background:#f67c5f; color:#f9f6f2;}
  .cell.v64{background:#f65e3b; color:#f9f6f2;}
  .cell.v128{background:#edcf72; color:#f9f6f2; font-size:clamp(1.2rem,6.5vw,1.9rem);}
  .cell.v256{background:#edcc61; color:#f9f6f2; font-size:clamp(1.2rem,6.5vw,1.9rem);}
  .cell.v512{background:#edc850; color:#f9f6f2; font-size:clamp(1.2rem,6.5vw,1.9rem);}
  .cell.v1024{background:#edc53f; color:#f9f6f2; font-size:clamp(1rem,5.4vw,1.6rem);}
  .cell.v2048{background:#edc22e; color:#f9f6f2; font-size:clamp(1rem,5.4vw,1.6rem);}
  .cell.vbig{background:#3c3a32; color:#f9f6f2; font-size:clamp(1rem,5.4vw,1.6rem);}
  .cell.pop{animation:pop .15s ease;}
  @keyframes pop{0%{transform:scale(.6);}100%{transform:scale(1);}}
  .actions{margin-top:12px; display:flex; gap:8px;}
  button{
    flex:1; border:0; border-radius:10px; padding:12px; font-size:1rem; font-weight:700;
    background:#8f7a66; color:#f9f6f2; cursor:pointer;
  }
  button:active{opacity:.85;}
  .hint{font-size:.8rem; color:#a79b8d; text-align:center; margin:12px 4px 0; line-height:1.45;}
  .overlay{
    position:fixed; inset:0; background:rgba(238,228,218,.6);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  .overlay.hidden{display:none;}
  .card{
    background:#fff; border-radius:16px; padding:24px; text-align:center;
    width:min(86vw,320px); box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  .card h2{margin:0 0 8px; color:var(--ink);}
  .card p{margin:6px 0;}
  .card .record{color:#f65e3b; font-weight:800;}
  .card button{margin-top:14px; width:100%;}
  .card button.secondary{background:#bbada0; margin-top:8px;}
  .hidden{display:none;}
  .backlink{display:inline-block; margin-top:6px; color:#a79b8d; text-decoration:none; font-weight:700; font-size:.9rem;}
  .backlink:active{opacity:.7;}
</style>
</head>
<body>
<div class="wrap">
  <a class="backlink" href="./">&lsaquo; Juegos</a>
  <h1 style="margin-top:2px;">2048</h1>
  <div class="topbar">
    <div class="box"><span class="label">Puntos</span><span class="val" id="score">0</span></div>
    <div class="box"><span class="label">Récord</span><span class="val" id="best">0</span></div>
  </div>
  <div class="board" id="board"></div>
  <div class="actions">
    <button id="newgame" type="button">Nueva partida</button>
  </div>
  <p class="hint">Desliza para mover las fichas. Junta dos iguales para sumarlas: <b>2 + 2 = 4</b>, 4 + 4 = 8… hasta llegar a <b>2048</b>. La partida se guarda sola.</p>
</div>

<div class="overlay hidden" id="overlay">
  <div class="card">
    <h2 id="overlay-title">Fin de la partida</h2>
    <p>Puntos: <b id="final">0</b></p>
    <p class="record hidden" id="record">¡Nuevo récord!</p>
    <button id="again" type="button">Otra partida</button>
    <button id="keepgoing" type="button" class="secondary hidden">Seguir jugando</button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var SIZE=4, SAVE_KEY="treses2048-save-v1", OLD_KEY="treses-save-v1";
  var board, score, best, over, won, keepPlaying;
  var boardEl=document.getElementById("board");
  var scoreEl=document.getElementById("score");
  var bestEl=document.getElementById("best");
  var overlay=document.getElementById("overlay");
  var overlayTitle=document.getElementById("overlay-title");
  var finalEl=document.getElementById("final");
  var recordEl=document.getElementById("record");
  var keepBtn=document.getElementById("keepgoing");

  function newGame(){
    board=[];for(var r=0;r<SIZE;r++){board.push([0,0,0,0]);}
    score=0;over=false;won=false;keepPlaying=false;
    spawnRandom();spawnRandom();
    overlay.classList.add("hidden");
    render();save();
  }

  function emptyCells(){
    var out=[];
    for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++)if(board[r][c]===0)out.push([r,c]);
    return out;
  }
  function spawnRandom(){
    var cells=emptyCells();
    if(!cells.length)return null;
    var p=cells[Math.floor(Math.random()*cells.length)];
    board[p[0]][p[1]]=Math.random()<0.9?2:4;
    return p;
  }

  function slideLine(line){
    var vals=line.filter(function(v){return v!==0;});
    var res=[],gained=0,mergedIdx=[],i=0;
    while(i<vals.length){
      if(i+1<vals.length&&vals[i]===vals[i+1]){
        res.push(vals[i]*2);gained+=vals[i]*2;mergedIdx.push(res.length-1);i+=2;
      }else{res.push(vals[i]);i+=1;}
    }
    while(res.length<SIZE)res.push(0);
    var moved=false;
    for(var k=0;k<SIZE;k++)if(res[k]!==line[k])moved=true;
    return{line:res,moved:moved,gained:gained,mergedIdx:mergedIdx};
  }

  function getLine(dir,idx){
    var line=[];
    for(var i=0;i<SIZE;i++){
      if(dir==="up")line.push(board[i][idx]);
      else if(dir==="down")line.push(board[SIZE-1-i][idx]);
      else if(dir==="left")line.push(board[idx][i]);
      else line.push(board[idx][SIZE-1-i]);
    }
    return line;
  }
  function setLine(dir,idx,line){
    for(var i=0;i<SIZE;i++){
      if(dir==="up")board[i][idx]=line[i];
      else if(dir==="down")board[SIZE-1-i][idx]=line[i];
      else if(dir==="left")board[idx][i]=line[i];
      else board[idx][SIZE-1-i]=line[i];
    }
  }

  function move(dir){
    if(over)return;
    var anyMoved=false,gain=0,mergeCells=[];
    for(var idx=0;idx<SIZE;idx++){
      var r=slideLine(getLine(dir,idx));
      if(r.moved){
        anyMoved=true;setLine(dir,idx,r.line);gain+=r.gained;
        for(var m=0;m<r.mergedIdx.length;m++){
          var i=r.mergedIdx[m];
          if(dir==="up")mergeCells.push([i,idx]);
          else if(dir==="down")mergeCells.push([SIZE-1-i,idx]);
          else if(dir==="left")mergeCells.push([idx,i]);
          else mergeCells.push([idx,SIZE-1-i]);
        }
      }
    }
    if(!anyMoved)return;
    score+=gain;
    if(score>best)best=score;
    var popCell=spawnRandom();
    render(popCell,mergeCells);
    save();
    if(!won&&!keepPlaying&&maxTile()>=2048){
      won=true;save();
      showOverlay("¡2048!",true);
      return;
    }
    if(!movesAvailable()){
      over=true;save();
      showOverlay("Fin de la partida",false);
    }
  }

  function maxTile(){
    var m=0;
    for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++)if(board[r][c]>m)m=board[r][c];
    return m;
  }
  function movesAvailable(){
    var r,c;
    for(r=0;r<SIZE;r++)for(c=0;c<SIZE;c++)if(board[r][c]===0)return true;
    for(r=0;r<SIZE;r++)for(c=0;c<SIZE;c++){
      if(c+1<SIZE&&board[r][c]===board[r][c+1])return true;
      if(r+1<SIZE&&board[r][c]===board[r+1][c])return true;
    }
    return false;
  }
  function showOverlay(title,canKeep){
    overlayTitle.textContent=title;
    finalEl.textContent=score;
    var isRecord=(score>=best&&score>0);
    recordEl.classList.toggle("hidden",!isRecord);
    keepBtn.classList.toggle("hidden",!canKeep);
    setTimeout(function(){overlay.classList.remove("hidden");},250);
  }

  function tileClass(v){
    if(v===2)return"";
    if(v<=2048)return"v"+v;
    return"vbig";
  }
  function render(popCell,mergeCells){
    boardEl.innerHTML="";
    for(var r=0;r<SIZE;r++)for(var c=0;c<SIZE;c++){
      var d=document.createElement("div");
      var v=board[r][c];
      if(v===0){d.className="cell empty";}
      else{
        d.className="cell "+tileClass(v);
        d.textContent=v;
        var isPop=popCell&&popCell[0]===r&&popCell[1]===c;
        var isMerge=false;
        if(mergeCells)for(var m=0;m<mergeCells.length;m++){
          if(mergeCells[m][0]===r&&mergeCells[m][1]===c){isMerge=true;break;}
        }
        if(isPop||isMerge)d.className+=" pop";
      }
      boardEl.appendChild(d);
    }
    scoreEl.textContent=score;
    bestEl.textContent=best;
  }

  function save(){
    try{localStorage.setItem(SAVE_KEY,JSON.stringify({board:board,score:score,best:best,over:over,won:won,keepPlaying:keepPlaying}));}catch(e){}
  }
  function load(){
    try{localStorage.removeItem(OLD_KEY);}catch(e){}
    try{
      var s=localStorage.getItem(SAVE_KEY);
      if(!s)return false;
      var o=JSON.parse(s);
      if(!o||!o.board||o.board.length!==SIZE)return false;
      var ok=true;
      for(var r=0;r<SIZE;r++){
        if(!o.board[r]||o.board[r].length!==SIZE){ok=false;break;}
        for(var c=0;c<SIZE;c++){
          var v=o.board[r][c];
          if(typeof v!=="number"||v<0||(v!==0&&(v&(v-1))!==0)){ok=false;break;}
        }
      }
      if(!ok)return false;
      board=o.board;score=o.score||0;best=o.best||0;over=!!o.over;won=!!o.won;keepPlaying=!!o.keepPlaying;
      return true;
    }catch(e){return false;}
  }

  // Entrada táctil
  var sx=0,sy=0,tracking=false;
  boardEl.addEventListener("touchstart",function(e){
    var t=e.changedTouches[0];sx=t.clientX;sy=t.clientY;tracking=true;
  },{passive:true});
  boardEl.addEventListener("touchmove",function(e){e.preventDefault();},{passive:false});
  boardEl.addEventListener("touchend",function(e){
    if(!tracking)return;tracking=false;
    var t=e.changedTouches[0];
    var dx=t.clientX-sx,dy=t.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?"right":"left");
    else move(dy>0?"down":"up");
  });
  // Teclado (escritorio)
  document.addEventListener("keydown",function(e){
    var map={ArrowUp:"up",ArrowDown:"down",ArrowLeft:"left",ArrowRight:"right"};
    if(map[e.key]){e.preventDefault();move(map[e.key]);}
  });
  // Ratón (arrastre, escritorio)
  var md=false;
  boardEl.addEventListener("mousedown",function(e){sx=e.clientX;sy=e.clientY;md=true;});
  document.addEventListener("mouseup",function(e){
    if(!md)return;md=false;
    var dx=e.clientX-sx,dy=e.clientY-sy;
    if(Math.max(Math.abs(dx),Math.abs(dy))<24)return;
    if(Math.abs(dx)>Math.abs(dy))move(dx>0?"right":"left");
    else move(dy>0?"down":"up");
  });

  document.getElementById("newgame").addEventListener("click",newGame);
  document.getElementById("again").addEventListener("click",newGame);
  keepBtn.addEventListener("click",function(){
    keepPlaying=true;overlay.classList.add("hidden");save();
  });

  best=0;
  if(!load()){best=0;newGame();}
  else{
    render();
    if(over){
      overlayTitle.textContent="Fin de la partida";
      finalEl.textContent=score;
      recordEl.classList.toggle("hidden",!(score>=best&&score>0));
      keepBtn.classList.add("hidden");
      overlay.classList.remove("hidden");
    }
  }
})();
</script>
</body>
</html>
