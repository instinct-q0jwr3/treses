<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Juegos</title>
<style>
  :root{ --bg:#faf8ef; --ink:#776e65; --muted:#a79b8d; }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;overscroll-behavior:none;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
    display:flex; justify-content:center; min-height:100dvh;
  }
  .wrap{width:min(92vw,430px); padding:max(16px, env(safe-area-inset-top)) 0 24px;}
  h1{font-size:2.2rem; margin:14px 0 2px; letter-spacing:.5px;}
  .sub{color:var(--muted); margin:0 0 18px; font-size:.95rem;}
  .card{
    display:flex; gap:14px; align-items:center; text-decoration:none; color:var(--ink);
    background:#fff; border-radius:16px; padding:14px; margin-bottom:14px;
    box-shadow:0 4px 18px rgba(119,110,101,.15);
  }
  .card:active{transform:scale(.98);}
  .preview{
    width:76px; height:76px; border-radius:12px; flex:none;
    display:grid; place-items:center; overflow:hidden;
  }
  .p2048{background:#bbada0; display:grid; grid-template-columns:1fr 1fr; gap:5px; padding:8px;}
  .p2048 span{
    border-radius:5px; display:flex; align-items:center; justify-content:center;
    font-weight:800; font-size:.95rem; color:#776e65; background:#eee4da;
  }
  .p2048 .a{background:#eee4da;} .p2048 .b{background:#ede0c8;}
  .p2048 .c{background:#f2b179; color:#f9f6f2;} .p2048 .d{background:#f59563; color:#f9f6f2;}
  .pprisma{background:#14141c;}
  .meta h2{margin:0 0 3px; font-size:1.25rem;}
  .meta p{margin:0; font-size:.85rem; color:var(--muted); line-height:1.4;}
  .foot{font-size:.78rem; color:var(--muted); text-align:center; margin-top:18px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>Juegos</h1>
  <p class="sub">Elige a cu&aacute;l quieres jugar.</p>

  <a class="card" href="2048.html">
    <div class="preview p2048"><span class="a">2</span><span class="b">4</span><span class="c">8</span><span class="d">16</span></div>
    <div class="meta">
      <h2>2048</h2>
      <p>Desliza las fichas y junta dos iguales para sumarlas hasta llegar a 2048.</p>
    </div>
  </a>

  <a class="card" href="prisma.html">
    <div class="preview pprisma">
      <svg viewBox="0 0 76 76" width="76" height="76" aria-hidden="true">
        <circle cx="22" cy="22" r="13" fill="#ff6b6b"/>
        <text x="22" y="27" text-anchor="middle" font-size="13" font-weight="800" fill="#fff" stroke="rgba(0,0,0,.4)" stroke-width="2.5" paint-order="stroke">1</text>
        <polygon points="54,12 66,34 42,34" fill="#fbbf24"/>
        <text x="54" y="30" text-anchor="middle" font-size="12" font-weight="800" fill="#fff" stroke="rgba(0,0,0,.4)" stroke-width="2.5" paint-order="stroke">2</text>
        <polygon points="38,42 40.9,48.6 48.1,49.2 42.6,53.8 44.3,60.8 38,57.2 31.7,60.8 33.4,53.8 27.9,49.2 35.1,48.6" fill="#34d399"/>
        <text x="38" y="55" text-anchor="middle" font-size="11" font-weight="800" fill="#fff" stroke="rgba(0,0,0,.4)" stroke-width="2.5" paint-order="stroke">3</text>
      </svg>
    </div>
    <div class="meta">
      <h2>Prisma</h2>
      <p>Encadena con un dedo colores, n&uacute;meros y formas en el panal. Sin reloj.</p>
    </div>
  </a>

  <p class="foot">Tus partidas y r&eacute;cords se guardan solos en este navegador.</p>
</div>
</body>
</html>
